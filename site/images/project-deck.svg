<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#8ba88a"/>
  <!-- Sky -->
  <rect width="400" height="150" fill="#c4b99a"/>
  <!-- Deck boards -->
  <g fill="#8b6a3f" stroke="#5a3825" stroke-width="2">
    <rect x="0" y="160" width="400" height="25"/>
    <rect x="0" y="185" width="400" height="25"/>
    <rect x="0" y="210" width="400" height="25"/>
    <rect x="0" y="235" width="400" height="25"/>
    <rect x="0" y="260" width="400" height="40"/>
  </g>
  <!-- Railing -->
  <line x1="0" y1="160" x2="400" y2="160" stroke="#2c1810" stroke-width="4"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#5a3825" stroke-width="6"/>
  <g stroke="#5a3825" stroke-width="4">
    <line x1="40" y1="100" x2="40" y2="160"/>
    <line x1="80" y1="100" x2="80" y2="160"/>
    <line x1="120" y1="100" x2="120" y2="160"/>
    <line x1="160" y1="100" x2="160" y2="160"/>
    <line x1="200" y1="100" x2="200" y2="160"/>
    <line x1="240" y1="100" x2="240" y2="160"/>
    <line x1="280" y1="100" x2="280" y2="160"/>
    <line x1="320" y1="100" x2="320" y2="160"/>
    <line x1="360" y1="100" x2="360" y2="160"/>
  </g>
  <!-- Tree in background -->
  <g transform="translate(330 150)">
    <rect x="-6" y="-50" width="12" height="50" fill="#2c1810"/>
    <circle cx="0" cy="-70" r="45" fill="#4a6741"/>
  </g>
</svg>
