<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#8ba88a"/>
  <!-- Wall -->
  <rect width="400" height="180" fill="#f4ede1"/>
  <!-- Floor tiles -->
  <g fill="#5a3825">
    <rect x="0" y="180" width="40" height="40"/>
    <rect x="80" y="180" width="40" height="40"/>
    <rect x="160" y="180" width="40" height="40"/>
    <rect x="240" y="180" width="40" height="40"/>
    <rect x="320" y="180" width="40" height="40"/>
    <rect x="40" y="220" width="40" height="40"/>
    <rect x="120" y="220" width="40" height="40"/>
    <rect x="200" y="220" width="40" height="40"/>
    <rect x="280" y="220" width="40" height="40"/>
    <rect x="360" y="220" width="40" height="40"/>
    <rect x="0" y="260" width="40" height="40"/>
    <rect x="80" y="260" width="40" height="40"/>
    <rect x="160" y="260" width="40" height="40"/>
    <rect x="240" y="260" width="40" height="40"/>
    <rect x="320" y="260" width="40" height="40"/>
  </g>
  <!-- Vanity -->
  <rect x="40" y="100" width="160" height="80" fill="#5a3825" stroke="#2c1810" stroke-width="2"/>
  <!-- Mirror -->
  <rect x="70" y="30" width="100" height="60" fill="#a8a8a8" stroke="#2c1810" stroke-width="2"/>
  <!-- Sink -->
  <ellipse cx="120" cy="115" rx="35" ry="10" fill="#a8a8a8"/>
  <!-- Bath -->
  <rect x="230" y="120" width="140" height="60" rx="10" fill="white" stroke="#2c1810" stroke-width="2"/>
</svg>
