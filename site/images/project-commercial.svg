<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#cdd8d3"/>
  <rect y="240" width="400" height="60" fill="#5f6b67"/>
  <!-- Commercial building -->
  <rect x="60" y="60" width="280" height="180" fill="#eef1ee" stroke="#28332f" stroke-width="3"/>
  <!-- Windows grid -->
  <g fill="#9bb0aa" stroke="#28332f" stroke-width="2">
    <rect x="80" y="80" width="40" height="40"/>
    <rect x="140" y="80" width="40" height="40"/>
    <rect x="220" y="80" width="40" height="40"/>
    <rect x="280" y="80" width="40" height="40"/>
    <rect x="80" y="140" width="40" height="40"/>
    <rect x="140" y="140" width="40" height="40"/>
    <rect x="220" y="140" width="40" height="40"/>
    <rect x="280" y="140" width="40" height="40"/>
  </g>
  <!-- Entry -->
  <rect x="180" y="180" width="40" height="60" fill="#1b211f"/>
  <!-- Sign -->
  <rect x="140" y="40" width="120" height="20" fill="#6e837e"/>
</svg>
