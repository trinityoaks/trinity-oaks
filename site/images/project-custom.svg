<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#9bb0aa"/>
  <rect y="220" width="400" height="80" fill="#596d69"/>
  <!-- Custom home -->
  <polygon points="60,100 60,220 200,220 200,100 130,50" fill="#eef1ee" stroke="#28332f" stroke-width="3"/>
  <polygon points="200,140 200,220 340,220 340,140 270,90" fill="#eef1ee" stroke="#28332f" stroke-width="3"/>
  <!-- Door -->
  <rect x="110" y="150" width="40" height="70" fill="#3d524d" stroke="#28332f" stroke-width="2"/>
  <!-- Windows -->
  <rect x="75" y="130" width="25" height="30" fill="#6e837e" stroke="#28332f" stroke-width="2"/>
  <rect x="160" y="130" width="25" height="30" fill="#6e837e" stroke="#28332f" stroke-width="2"/>
  <rect x="220" y="160" width="30" height="35" fill="#6e837e" stroke="#28332f" stroke-width="2"/>
  <rect x="280" y="160" width="30" height="35" fill="#6e837e" stroke="#28332f" stroke-width="2"/>
  <!-- Porch -->
  <rect x="60" y="200" width="140" height="20" fill="#3d524d"/>
  <!-- Tree -->
  <g transform="translate(370 230)">
    <rect x="-8" y="-50" width="16" height="50" fill="#28332f"/>
    <circle cx="0" cy="-70" r="40" fill="#596d69"/>
