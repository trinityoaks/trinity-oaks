<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#c4b99a"/>
  <rect x="0" y="180" width="400" height="120" fill="#8b6a3f"/>
  <!-- Cabinets -->
  <rect x="40" y="60" width="320" height="80" fill="#5a3825" stroke="#2c1810" stroke-width="3"/>
  <line x1="120" y1="60" x2="120" y2="140" stroke="#2c1810" stroke-width="3"/>
  <line x1="200" y1="60" x2="200" y2="140" stroke="#2c1810" stroke-width="3"/>
  <line x1="280" y1="60" x2="280" y2="140" stroke="#2c1810" stroke-width="3"/>
  <!-- Counter -->
  <rect x="20" y="160" width="360" height="30" fill="#1f1a14"/>
  <!-- Lower cabinets -->
  <rect x="40" y="190" width="320" height="80" fill="#5a3825" stroke="#2c1810" stroke-width="3"/>
  <line x1="160" y1="190" x2="160" y2="270" stroke="#2c1810" stroke-width="3"/>
  <line x1="240" y1="190" x2="240" y2="270" stroke="#2c1810" stroke-width="3"/>
  <!-- Sink -->
  <rect x="170" y="155" width="60" height="20" fill="#a8a8a8"/>
</svg>
